<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Fantasy-Football-Draftboard mit Expertenrankings, Tiers, Offense-Projektion und Strength of Schedule.">
<title>Draft Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M16 6c4.6 0 8.4 1.6 8.4 2.4v15.2C24.4 24.4 20.6 26 16 26s-8.4-1.6-8.4-2.4V8.4C7.6 7.6 11.4 6 16 6z' fill='%234c8dff'/%3E%3Cpath d='M16 10.5v11M12.5 13h7M12.5 19h7' stroke='%230d1117' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__row">
    <h1 class="brand">Draft&nbsp;Board</h1>
    <nav class="views" id="viewTabs" role="tablist">
      <button class="view" role="tab" data-view="board" aria-selected="true">Board</button>
      <button class="view" role="tab" data-view="breakouts" aria-selected="false">Rookies&nbsp;&amp;&nbsp;Breakouts</button>
      <button class="view" role="tab" data-view="discount" aria-selected="false">Versteckte&nbsp;Werte</button>
    </nav>
    <div class="chips" id="statusChips"></div>
    <button class="btn btn--ghost" id="toggleWeights" aria-expanded="false">Gewichtung</button>
  </div>
</header>

<main>
  <section class="panel" id="weightsPanel" hidden>
    <div class="sliders" id="sliders"></div>
    <p class="hint" id="weightsNote"></p>
    <div class="btnrow">
      <button class="btn btn--ghost" id="btnResetWeights">Zurücksetzen</button>
      <button class="btn btn--ghost" id="btnClearDrafted">Alle Markierungen löschen</button>
    </div>
  </section>

  <section class="controls" id="controls">
    <div class="tabs" id="posTabs" role="tablist"></div>
    <div class="controls__row">
      <input type="search" id="fSearch" placeholder="Spieler oder Team…" autocomplete="off"
             spellcheck="false" aria-label="Spieler suchen">
      <select id="fSort" aria-label="Sortierung">
        <option value="score">Mein Score</option>
        <option value="ecr">Experten-Ranking</option>
        <option value="value">Wert gegen Ranking</option>
        <option value="offense">Offense</option>
        <option value="sos">Spielplan</option>
        <option value="prior">Vorjahrespunkte</option>
      </select>
      <label class="switch"><input type="checkbox" id="fHideDrafted" checked><span>Weg ausblenden</span></label>
      <label class="switch"><input type="checkbox" id="fExpandAll"><span>Alles ausklappen</span></label>
      <span class="spacer"></span>
      <span class="hint" id="listMeta"></span>
    </div>
  </section>

  <p class="lead" id="viewLead" hidden></p>
  <div id="views"></div>

  <details class="panel sources">
    <summary>Datenquellen und Methodik</summary>
    <div id="sourcesBox"></div>
  </details>
</main>

<footer class="foot">
  <p id="footNote"></p>
</footer>

<div class="toast" id="toast" hidden></div>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
